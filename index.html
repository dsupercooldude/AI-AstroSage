<!DOCTYPE html>

<head>

    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS (Handled by Vite Plugin) -->

    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Fraunces & Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>

    <style>
      body {
        font-family: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #09090b;
        color: #f1f5f9;
      }
      .font-serif { font-family: 'Fraunces', serif; }
      .bgcard { background-color: #18181b; }
      .bgcard2 { background-color: #18181b; }
      .bgfaint { background-color: rgba(255, 255, 255, 0.02); }
      .bento-card {
        background-color: #18181b;
        border: 1px solid #27272a;
        border-radius: 1.5rem;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .bento-card:hover {
        border-color: #3f3f46;
      }
      .bento-inner {
        background-color: #09090b;
        border: 1px solid #27272a;
        border-radius: 1rem;
      }
      .t100 { color: #ffffff; }
      .t85 { color: #e2e8f0; }
      .t75 { color: #cbd5e1; }
      .t60 { color: #94a3b8; }
      .t50 { color: #64748b; }
      .t40 { color: #475569; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .gl-fadein { animation: fadeIn 0.3s ease-out forwards; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

      /* Google Translate Overrides */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0px !important; }
      .goog-te-gadget { color: transparent !important; }
      .goog-te-gadget span { display: none !important; }
      .goog-te-gadget select {
        background-color: #09090b !important;
        color: #818cf8 !important;
        border: 1px solid #3730a3 !important;
        padding: 4px 8px !important;
        border-radius: 6px !important;
        font-family: 'Sora', monospace !important;
        font-size: 10px !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        outline: none !important;
        cursor: pointer !important;
        width: 120px !important;
      }
      .goog-te-gadget select:hover { border-color: #4f46e5 !important; }

    </style>
</head>
<body class="bg-[#09090b] min-h-screen text-slate-200 selection:bg-indigo-500 selection:text-white font-sans">

    <!-- React Root Mount Point -->
    <div id="root">
        <!-- Initial Bootloader (Replaced by React App on Successful Load) -->
        <div id="bootloader" class="min-h-screen flex items-center justify-center p-4">
          <div class="text-center space-y-3">
            <div class="w-10 h-10 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <div class="font-mono text-xs text-cyan-300 tracking-widest uppercase">Initializing Graha Ledger Engine...</div>
          </div>
        </div>
    </div>
    <!-- Vite Main React Entry -->
    <script type="module" src="/src/main.tsx"></script>
